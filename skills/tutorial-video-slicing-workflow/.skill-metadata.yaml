examples:
  - id: full-production-from-articles
    title:
      zh: 从文章与录屏制作完整解说成片
      en: Full Narrated Video From Articles and Footage
    description:
      zh: 用宣传文章、产品资料和真实操作录屏产出配音字幕完整的宣发或演示成片
      en: Turn promo articles, product material and real operation recordings into a fully narrated promo or demo video
    prompt:
      zh: |-
        请用以下资料制作一条完整解说视频：

        文章/业务资料：{{文档路径}}
        操作录屏：{{视频路径（可多个）}}
        目标画幅：{{16:9 横版 / 3:4 小红书 / 两者}}
        输出目录：{{输出根目录}}

        先建立素材证据库并写出唯一旁白脚本给我确认；确认后按锁定流程完成试听、配音、字幕、画面匹配、双重预览、渲染与质检。
      en: |-
        Produce one fully narrated video from these materials:

        Articles/business material: {{document paths}}
        Operation recordings: {{video path(s)}}
        Target formats: {{16:9 landscape / 3:4 Xiaohongshu / both}}
        Output: {{output root folder}}

        Build a footage evidence library first and deliver one narration script for my approval; after confirmation follow the locked workflow through voice audition, voiceover, subtitles, visual matching, dual preview, rendering and QC.

  - id: tutorial-slicing
    title:
      zh: 教程切片与章节切割
      en: Tutorial Slicing & Chapter Cuts
    description:
      zh: 保留长教程结构，按章节切割并提取可独立观看的高光切片
      en: Keep the tutorial structure, cut by chapter and extract standalone highlight clips
    prompt:
      zh: |-
        请按教程切片模式处理这份长教程：

        源视频：{{视频或 zip 路径}}
        输出目录：{{输出根目录}}

        探测素材并用场景变化点定位标题卡与章节边界，经视觉确认后切割章节，筛出可独立观看的高光切片，输出 segments.json、高光候选表和项目清单；是否派生竖版逐条与我确认，不要复制多套字幕和配音来源。
      en: |-
        Process this long tutorial in slicing mode:

        Source: {{video or zip path}}
        Output: {{output root folder}}

        Probe the footage, locate title cards and chapter edges via scene changes plus visual confirmation, cut chapters, extract standalone highlights, and output segments.json, a highlight shortlist and the project manifest; confirm per-clip portrait variants with me and never duplicate subtitle or voiceover sources.

  - id: enterprise-business-demo
    title:
      zh: 企业业务演示视频
      en: Enterprise Business Demo Video
    description:
      zh: 用 Agent/RPA/SaaS 真实操作素材与业务解说呈现任务链与业务结果
      en: Present the task chain and business outcomes of Agent/RPA/SaaS work using real operation footage and narration
    prompt:
      zh: |-
        请把以下真实操作素材和业务资料做成企业业务演示视频：

        操作素材：{{视频文件或目录}}
        业务文字稿：{{文档路径}}
        版本：{{总览版 / 详解版}}
        输出目录：{{输出根目录}}

        关键任务连续展示「提出需求 → 调用 → 执行 → 数据返回 → 分析 → 输出结果」，素材缺口用统一组件补齐；先锁脚本、再锁声音试听，然后才进入正式渲染。
      en: |-
        Turn this real operation footage and business material into an enterprise demo video:

        Footage: {{video files or folder}}
        Transcript: {{document path}}
        Variant: {{overview / detailed}}
        Output: {{output root folder}}

        Show the chain "request → invoke → execute → data returned → analysis → result" continuously for key tasks, fill gaps with unified components; lock the script and voice audition before any formal rendering.

  - id: caption-driven-voiceover
    title:
      zh: 字幕驱动配音与时间线
      en: Caption-Driven Voiceover & Timeline
    description:
      zh: 按已有字幕逐句生成对齐配音并锁定正式字幕时间线
      en: Generate sentence-aligned voiceover from existing captions and lock the formal subtitle timeline
    prompt:
      zh: |-
        请基于字幕生成对齐配音：

        视频：{{视频路径}}
        字幕：{{SRT/VTT/JSON 路径}}
        原声处理：{{替换原声 / 压低混音}}

        先跑 scripts/subtitle_voiceover.py --dry-run 校验时间轴并给我配音计划；按完整自然句合成，句末不得保留标点，特殊词先试听；超时句不得默认截断；保留 JSON 质检报告。音色未经我确认不得更换。
      en: |-
        Create aligned voiceover from these captions:

        Video: {{video path}}
        Captions: {{SRT/VTT/JSON path}}
        Original audio: {{replace / duck and mix}}

        Run scripts/subtitle_voiceover.py --dry-run first and share the voiceover plan; synthesize by complete natural sentences without trailing punctuation, audition special words, never truncate overtime cues by default, and keep the JSON QA report. Do not swap voices without my confirmation.

  - id: landscape-portrait-variants
    title:
      zh: 横竖版单源派生
      en: Landscape/Portrait Variants From One Timeline
    description:
      zh: 从同一内容时间线渲染 16:9 与冰蓝品牌 3:4 小红书版
      en: Render 16:9 and ice-blue brand 3:4 Xiaohongshu cuts from the same content timeline
    prompt:
      zh: |-
        请从当前项目派生以下画幅：

        项目清单：{{project-manifest.json 路径}}
        目标画幅：{{16:9、3:4 小红书品牌版等}}
        输出目录：{{输出根目录}}

        横竖版必须共用旁白、字幕、镜头 ID 与入出点，只保存布局覆盖项；3:4 逐镜头按 framing-cues 取景，产品框 fill 铺满，字幕在产品框外重新排版，禁止复用已烧录横版字幕。
      en: |-
        Derive these formats from the current project:

        Manifest: {{project-manifest.json path}}
        Targets: {{16:9, 3:4 Xiaohongshu brand, etc.}}
        Output: {{output root folder}}

        Variants must share narration, subtitles, shot IDs and in/out points, storing only layout overrides; for 3:4 use per-shot framing cues, fill the product frame, re-layout subtitles outside the frame, and never reuse burned-in landscape subtitles.

  - id: demo-sfx-enhancement
    title:
      zh: 产品演示音效与视觉增强
      en: Product Demo SFX & Visual Enhancement
    description:
      zh: 为点击、输入、阶段切换和结果出现叠加统一音效与视觉强调
      en: Layer unified SFX and visual emphasis on clicks, typing, stage changes and results
    prompt:
      zh: |-
        请为这条已锁定字幕与配音的演示视频做增强：

        视频：{{16:9 已锁定版本路径}}
        强度：{{clear（默认）/ 其他档位}}

        逐帧确认真实界面事件后建立 cue sheet，只使用统一音效库与增强样式资产；先生成无字幕增强内容母版，再派生各画幅；禁止凭感觉堆特效或为单条视频另造声音。
      en: |-
        Enhance this demo video whose subtitles and voiceover are locked:

        Video: {{locked 16:9 path}}
        Intensity: {{clear (default) / other tier}}

        Confirm real UI events frame by frame into a cue sheet, using only the shared SFX library and enhancement style assets; render the subtitle-free enhanced content master first, then derive all formats; no gut-feel effects or one-off sounds.

  - id: replication-qc-delivery
    title:
      zh: 复刻校验与质检交付
      en: Replication Checks & QC Delivery
    description:
      zh: 按项目清单与锁定校验完成双重预览、质检和七目录交付
      en: Run dual previews, automated QA and the seven-directory delivery via manifest and render-lock checks
    prompt:
      zh: |-
        请对本项目执行质检与交付：

        项目清单：{{project-manifest.json 路径}}
        参考基准：{{参考成片与黄金质检目录（如有）}}

        依次运行 validate_project_manifest.py、字幕/配音报告、媒体时长与完整解码检查和 validate_render_lock.py；核对与参考成片的时长、分辨率、帧率、镜头顺序一致性；全部通过后按七个交付目录整理最终版本，工作文件与预览留在 delivery/ 之外。
      en: |-
        Run QC and delivery for this project:

        Manifest: {{project-manifest.json path}}
        Baseline: {{reference video and golden QC folder (if any}}

        Execute validate_project_manifest.py, subtitle/voiceover reports, duration and full-decode media checks, and validate_render_lock.py in order; verify duration, resolution, fps and shot-order consistency against the reference; only after all pass, assemble the seven delivery directories with current finals, keeping work files and previews outside delivery/.
  - id: interview-source-rough-cut
    title:
      zh: 访谈源素材自动粗剪
      en: Interview Source Rough-Cut
    description:
      zh: 仅当用户提供访谈 / 口播素材并明确要求时，自动剔除长静音与重复段落
      en: Only when the user provides interview footage and explicitly asks, auto-remove long silence and duplicate segments
    prompt:
      zh: |-
        请对这段访谈 / 口播素材做自动粗剪与无效片段剔除：

        源视频：{{访谈或口播视频路径}}
        转写：{{源视频时间戳对齐的 SRT/VTT/JSON 路径，可选}}
        输出目录：{{work/ 或输出根目录}}

        先跑 scripts/auto_rough_cut.py run 生成 work/cut_plan.json 供我审阅；我确认后把 review.status 改为 approved，再跑 apply 产出粗剪版。注意：仅当素材确为访谈 / 口播且我明确要求时才做，教程 / 业务演示 / 社媒宣发不做此步；不要静默删除业务内容，长静音阈值与相似度阈值待真实素材验证后再校准。
      en: |-
        Do an automatic rough-cut and invalid-segment removal on this interview / talking-head footage:

        Source: {{interview or talking-head video path}}
        Transcript: {{SRT/VTT/JSON aligned to source timestamps, optional}}
        Output: {{work/ or output root}}

        Run scripts/auto_rough_cut.py run to produce work/cut_plan.json for my review; after I approve, set review.status to approved and run apply for the rough-cut. Only do this when the footage is genuinely interview/talking-head AND I explicitly ask; skip for tutorials, business demos and promos; never silently drop substantive content, and recalibrate silence/similarity thresholds after testing on real material.
